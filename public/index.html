<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ganga Travels Invoice Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 15px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 220px;
            padding: 30px;

            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;

            text-decoration: none;
            color: #111;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease,
                transform 0.15s ease;
        }

        .action:hover {
            border-color: #999;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .action-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .action-description {
            color: #666;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <header class="header">
            <h1>Ganga Travels</h1>
            <p>Invoice Generator</p>
        </header>

        <section class="actions">

            <a class="action" href="/generate.html">
                <div class="action-title">Generate Bill</div>
                <div class="action-description">
                    Create a new invoice
                </div>
            </a>

            <a class="action" href="/bills.html">
                <div class="action-title">View Bills</div>
                <div class="action-description">
                    View previously generated invoices
                </div>
            </a>

        </section>

    </main>
</body>

</html>
